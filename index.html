<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d1c"><meta name="description" content="NEXORA AI — intelligent chat, coding and multilingual assistance"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><title>NEXORA AI — Your Intelligent Companion</title></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">N</div><div><strong>NEXORA<span>AI</span></strong><small>INTELLIGENCE REIMAGINED</small></div></div><button id="newChat" class="new-chat">＋ New conversation</button><div class="section-label">YOUR CONVERSATIONS</div><nav id="history"></nav><div class="side-bottom"><button id="exportChat" class="side-action">⇩ Export conversation</button><button id="settings" class="side-action">⚙ Access settings</button><div class="developer">NEXORA AI 1.0<br>Built by Dudekula Ayaan ahammad</div></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Toggle menu">☰</button><div class="top-title"><span class="online-dot"></span><strong>NEXORA AI</strong><span class="version">V1.0</span></div><div class="top-actions"><span class="secure">✦ AI POWERED</span><button id="clearChat" title="Clear current conversation">↻</button></div></header><div id="messages" class="messages" aria-live="polite"></div><div class="composer-wrap"><div id="status" class="status" role="status"></div><form id="chatForm" class="composer"><textarea id="prompt" placeholder="Ask NEXORA anything..." rows="1" maxlength="4000" aria-label="Your message" required></textarea><button id="send" type="submit" aria-label="Send message">➤</button></form><div class="disclaimer">NEXORA AI can make mistakes. Verify important information.</div></div></main></div>
<dialog id="authDialog"><h2>Secure AI access</h2><p>Enter the private password configured on your hosting server.</p><input type="password" id="password" placeholder="Access password" autocomplete="off"><div class="dialog-actions"><button id="cancelAuth">Cancel</button><button id="saveAuth">Continue</button></div></dialog><script src="/app.js" defer></script></body></html>
