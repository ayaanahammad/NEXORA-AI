<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA AI — Your Intelligent Companion</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9edff;background:#080d1d}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;height:100dvh}.sidebar{width:265px;background:#0d1428;border-right:1px solid #26314e;padding:22px;display:flex;flex-direction:column;gap:18px}.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:#b9caff}.logo span{color:#7d8cff}.small{font-size:12px;color:#9aa9ce}.new,.send{background:linear-gradient(120deg,#536dff,#a55cff);color:white;border-radius:12px;padding:12px 16px;font-weight:700}.history{overflow:auto;flex:1}.history button{display:block;width:100%;text-align:left;padding:11px;margin:5px 0;background:#141e36;color:#cbd5f5;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active{outline:1px solid #647cff}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{padding:19px 26px;border-bottom:1px solid #25304c;display:flex;align-items:center;justify-content:space-between}.status{font-size:12px;color:#a2e5bd}.chat{flex:1;overflow-y:auto;padding:24px max(22px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:20px}.welcome{margin:auto;text-align:center;max-width:580px}.orb{width:104px;height:104px;margin:0 auto 25px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#e3dcff,#8a82ff 28%,#3c52cb 60%,#151e57 80%);box-shadow:0 0 60px #5269ff70,0 0 130px #7a4bff40}.welcome h1{font-size:36px;margin:0 0 12px}.welcome p{color:#a5b1d1;line-height:1.7}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}.chips button,.iconbtn{background:#18233d;border:1px solid #344363;color:#d9e1ff;border-radius:12px;padding:11px}.msg{max-width:85%;padding:15px 19px;border-radius:17px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#394cb2}.msg.assistant{align-self:flex-start;background:#16213a;border:1px solid #293758}.composer{padding:16px max(20px,calc((100% - 850px)/2)) 25px;background:#080d1d}.compose{display:flex;gap:10px;align-items:end;border:1px solid #3b496b;background:#131c31;padding:10px;border-radius:18px}textarea{flex:1;min-width:0;resize:none;background:transparent;border:0;outline:none;color:white;min-height:48px;max-height:160px;padding:12px}.hint{text-align:center;color:#7787ac;font-size:11px;margin-top:10px}.iconbtn{min-width:45px}.error{color:#ffb0b0;font-size:13px;margin:6px}.mobile{display:none}@media(max-width:720px){.sidebar{display:none}.top{padding:15px}.chat{padding:20px}.composer{padding:12px}.welcome h1{font-size:27px}.mobile{display:inline-block}.msg{max-width:94%}}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#10152d"><link rel="icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><div class="app"><aside class="sidebar"><div class="logo">✦ NEXORA <span>AI</span></div><div class="small">Your intelligent companion</div><button class="new" onclick="newChat()">＋ New conversation</button><div class="small">RECENT CHATS</div><div id="history" class="history"></div><div class="small">🔒 Chats saved on this browser<br>Powered by your configured AI API</div></aside><main class="main"><header class="top"><strong>✦ NEXORA AI</strong><span class="status">● Ready to chat</span><button class="iconbtn mobile" onclick="newChat()">＋</button></header><section id="chat" class="chat"></section><footer class="composer"><div class="compose"><button class="iconbtn" id="mic" title="Speak" onclick="listen()">🎙️</button><textarea id="input" placeholder="Ask NEXORA anything..." rows="1"></textarea><button class="iconbtn" id="voice" title="Toggle spoken answers" onclick="toggleVoice()">🔇</button><button class="send" id="send" onclick="send()">➤</button></div><div id="error" class="error"></div><div class="hint">NEXORA AI can make mistakes. Verify important information.</div></footer></main></div><script>
const KEY='nexora-chats-v1';let chats;try{chats=JSON.parse(localStorage.getItem(KEY))||[]}catch{chats=[]}let active=chats[0]?.id||null,voice=false,busy=false;const el=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(chats));renderHistory()};function current(){return chats.find(c=>c.id===active)}function newChat(){active=null;render()}function renderHistory(){el('history').innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title;b.className=c.id===active?'active':'';b.onclick=()=>{active=c.id;render()};el('history').append(b)})}function render(){renderHistory();const root=el('chat');root.innerHTML='';const c=current();if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="orb"></div><h1>Meet NEXORA AI</h1><p>Think bigger. Create faster. Ask anything.<br>Your next great idea starts with a conversation.</p><div class="chips"><button>Help me learn AI</button><button>Write Python code</button><button>Brainstorm ideas</button></div>';w.querySelectorAll('button').forEach(b=>b.onclick=()=>{el('input').value=b.textContent;el('input').focus()});root.append(w)}else c.messages.forEach(m=>addMessage(m.role,m.content));root.scrollTop=root.scrollHeight}function addMessage(role,content){const d=document.createElement('div');d.className='msg '+role;d.textContent=content;el('chat').append(d);el('chat').scrollTop=el('chat').scrollHeight;return d}async function send(){const t=el('input').value.trim();if(!t||busy)return;el('error').textContent='';if(!current()){active=String(Date.now());chats.unshift({id:active,title:t.slice(0,36),messages:[]})}const c=current();c.messages.push({role:'user',content:t});el('input').value='';render();busy=true;el('send').disabled=true;const pending=addMessage('assistant','NEXORA is thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');pending.textContent=d.reply;c.messages.push({role:'assistant',content:d.reply});save();if(voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.reply);u.rate=1;speechSynthesis.speak(u)}}catch(e){pending.remove();el('error').textContent=e.message;save()}finally{busy=false;el('send').disabled=false}}el('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});function toggleVoice(){voice=!voice;el('voice').textContent=voice?'🔊':'🔇';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel()}function listen(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){el('error').textContent='Speech recognition is not available in this browser.';return}const r=new SpeechRecognition();r.lang=navigator.language||'en-US';r.onresult=e=>{el('input').value=e.results[0][0].transcript;el('input').focus()};r.onerror=e=>el('error').textContent='Microphone: '+e.error;r.start()}render();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
